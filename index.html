<!doctype html>
<html lang="pt-BR">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: coluna única estilo comanda, barra de etapas fixa embaixo, notas de pagamento com picote */
:root{
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#F0F1F4; --card:#FFFFFF; --field:#EEEFF2; --line:#E5E5E5;
  --ink:#14213D; --muted:#566079;
  --accent:#FCA311; --on-accent:#14213D; --accent-text:#8F5400;
  --chrome:#14213D; --on-chrome:#FFFFFF; --on-chrome-dim:#B6BDCC;
  --chip:#E5E5E5; --danger:#B42318; --ok:#12663F;
  --shadow:0 10px 24px -16px rgba(20,33,61,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14213D; --card:#1B2A4C; --field:#111C34; --line:#2C3C63;
    --ink:#F5F6F8; --muted:#A8B2C7;
    --accent:#FCA311; --on-accent:#14213D; --accent-text:#FCA311;
    --chrome:#000000; --on-chrome:#FFFFFF; --on-chrome-dim:#9AA3B5;
    --chip:#26375E; --danger:#FF8F85; --ok:#5EE0A0;
    --shadow:0 12px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14213D; --card:#1B2A4C; --field:#111C34; --line:#2C3C63;
  --ink:#F5F6F8; --muted:#A8B2C7;
  --accent:#FCA311; --on-accent:#14213D; --accent-text:#FCA311;
  --chrome:#000000; --on-chrome:#FFFFFF; --on-chrome-dim:#9AA3B5;
  --chip:#26375E; --danger:#FF8F85; --ok:#5EE0A0;
  --shadow:0 12px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shell{
  max-width:560px;margin:0 auto;padding-block:6px 128px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stack{display:grid;gap:14px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.mk-a{fill:var(--ink)} .mk-b{fill:var(--accent)} .mk-c{stroke:var(--bg)}
.h1{font:800 30px/1.08 var(--f-display);letter-spacing:-.025em;margin:6px 0 2px;text-wrap:balance}
.h2{font:700 17px/1.2 var(--f-display);letter-spacing:-.01em;margin:0}
.muted{color:var(--muted);font-size:14px;margin:0}
.lbl{display:block;font:700 12px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0;display:grid;gap:14px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 22%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
.note p{margin:0;font-size:14px;flex:1 1 200px}

.field{width:100%;min-width:0;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid transparent;background:var(--field);color:var(--ink);font:500 16px var(--f-body)}
.field::placeholder{color:var(--muted);opacity:.75}
.field:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.field.sm{min-height:42px;font-size:15px}
select.field{appearance:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font:700 16px var(--f-body);text-decoration:none;text-align:center;line-height:1.1}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{min-height:54px;font-size:17px}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid transparent;background:transparent;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.prow{display:grid;grid-template-columns:36px minmax(0,1fr) 44px;gap:8px 10px;align-items:center}
.prow+.prow{padding-top:12px;border-top:1px solid var(--line);margin-top:12px}
.prow .phone{grid-column:2 / 4}
.people{display:grid}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-display);background:color-mix(in srgb,var(--accent) 30%,var(--card));color:var(--ink)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:var(--field)}
.seg button{min-height:44px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.switch{flex:none;width:54px;height:32px;border-radius:999px;border:0;background:var(--field);position:relative;transition:background .15s}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(22px);background:var(--on-accent)}
.pct-wrap{position:relative;max-width:140px}
.pct-wrap .field{padding-right:34px;text-align:right;font-family:var(--f-mono)}
.pct-wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono)}

.money-wrap{position:relative;min-width:0}
.money-wrap>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font:500 15px var(--f-mono);pointer-events:none}
.field.money{padding-left:40px;text-align:right;font:500 17px var(--f-mono);font-variant-numeric:tabular-nums}
.money-wrap.big>span{font-size:20px;left:16px}
.field.big{min-height:76px;padding-left:56px;font:700 36px var(--f-display);letter-spacing:-.02em}

.item{display:grid;gap:10px}
.item+.item{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.item-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-mid .money-wrap{flex:1 1 130px}
.stepper{display:inline-flex;align-items:center;background:var(--field);border-radius:12px}
.stepper button{width:44px;height:48px;border:0;background:transparent;font:700 22px var(--f-body);color:var(--ink);border-radius:12px}
.stepper output{min-width:26px;text-align:center;font:500 17px var(--f-mono)}
.line-total{flex:1 0 100%;text-align:right;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid transparent;background:var(--chip);color:var(--ink);font:500 14px var(--f-body)}
.chip.all{background:transparent;border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.empty{margin:0;padding:8px 0;color:var(--muted);font-size:15px}
.warn{margin:0;padding:10px 12px;border-radius:12px;font-size:14px;background:color-mix(in srgb,var(--danger) 14%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--danger) 50%,var(--line))}

.leaders{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.leaders li{display:flex;align-items:baseline;gap:8px;min-width:0}
.leaders .nm{min-width:0;overflow-wrap:anywhere}
.leaders .nm small{color:var(--muted);font:500 12px var(--f-mono)}
.leaders .dots{flex:1;min-width:12px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.leaders .val{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.leaders li.total{padding-top:8px;margin-top:2px;border-top:2px dashed var(--line);font-weight:700}
.leaders li.total .val{font-size:17px;font-weight:500}
.leaders li.fee .nm{color:var(--muted)}
.check{margin:0;font-size:14px;color:var(--ok);font-weight:500}
.check.bad{color:var(--danger)}

.nota{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.nota-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who h3{margin:0;font:700 18px/1.15 var(--f-display);overflow-wrap:anywhere}
.who p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.amount{font:800 28px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.tear{position:relative;border-top:2px dashed var(--line);margin:0 -16px}
.tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tear::before{left:-10px} .tear::after{right:-10px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.callout{margin:0;display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--field);font-size:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font:700 12px var(--f-body);background:color-mix(in srgb,var(--accent) 30%,var(--card));color:var(--ink)}

details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:none;margin-right:4px}
details[open]>summary::after{transform:rotate(-135deg)}
.pixcfg{display:block}
.pixcfg[open]>summary{margin-bottom:12px}
.pill{font:700 12px var(--f-body);padding:4px 10px;border-radius:999px;background:var(--field);color:var(--muted);margin-left:auto}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.form{display:grid;gap:6px}
.form .lbl{margin-top:8px}
.hint{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hint.bad{color:var(--danger)} .hint.ok{color:var(--ok)}
.qrwrap{display:grid;gap:12px;justify-items:center;padding-top:6px}
.qrbox{width:min(260px,100%);background:#fff;border-radius:12px;padding:6px;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.code{width:100%;margin:0;padding:10px 12px;border-radius:12px;background:var(--field);font:400 12px/1.4 var(--f-mono);word-break:break-all;user-select:all;-webkit-user-select:all}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--chrome);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.tabbtn{display:grid;justify-items:center;gap:3px;padding:8px 4px 6px;border:0;border-radius:12px;background:transparent;color:var(--on-chrome-dim);font:700 12px var(--f-body);letter-spacing:.02em;position:relative}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-current="page"]{color:var(--accent)}
.tabbtn[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.theme-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.theme-btn svg{width:22px;height:22px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:min(92vw,420px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font:500 14px var(--f-body);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle class="mk-a" cx="15" cy="15" r="14"/><path class="mk-b" d="M15 1a14 14 0 0 1 0 28z"/><path class="mk-c" d="M15 1v28" stroke-width="2.4" fill="none"/></svg>
      <span>Racha Conta</span>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Alternar entre tema claro e escuro" title="Tema claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
    </button>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="nav" aria-label="Etapas">
  <div class="nav-in">
    <button class="tabbtn" data-tab="mesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.2c2.4.3 4 2.4 4 5.2"/></svg>Mesa</button>
    <button class="tabbtn" data-tab="conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Conta</button>
    <button class="tabbtn" data-tab="dividir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><path d="M8.5 12h6.5M12.5 9.2l2.8 2.8-2.8 2.8"/></svg>Dividir</button>

</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
'use strict';
document.documentElement.lang='pt-BR';

/*<logic>*/
const onlyDigits=s=>String(s==null?'':s).replace(/\D/g,'');
const group=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtNum=c=>group(Math.floor(c/100))+','+String(c%100).padStart(2,'0');
const brl=c=>(c<0?'-':'')+'R$ '+fmtNum(Math.abs(c));
const pctLabel=p=>String(p).replace('.',',');
const feeCents=(sub,pct)=>Math.round(sub*Math.round(pct*100)/10000);

/* Divide a conta em centavos inteiros. Sobras de centavo vao para a primeira pessoa da divisao. */
function compute(st){
  const pct=st.fee.on?st.fee.pct:0;
  const res=st.people.map(p=>({id:p.id,name:p.name,sub:0,fee:0,total:0,lines:[]}));
  const n=res.length;
  let subtotal=0,unassigned=[],unassignedCents=0,leftover=false;
  if(n>0){
    if(st.mode==='equal'){
      subtotal=st.total;
      const base=Math.floor(subtotal/n),r=subtotal-base*n;
      res.forEach((x,i)=>{x.sub=base+(i===0?r:0);});
      if(r>0)leftover=true;
    }else{
      st.items.forEach(it=>{
        const L=it.qty*it.unit;
        const idx=[];
        res.forEach((x,i)=>{if(it.who.indexOf(x.id)>=0)idx.push(i);});
        if(!idx.length){if(L>0){unassigned.push(it);unassignedCents+=L;}return;}
        const k=idx.length,base=Math.floor(L/k),r=L-base*k;
        idx.forEach((i,j)=>{
          const c=base+(j===0?r:0);
          res[i].sub+=c;
          res[i].lines.push({name:it.name&&it.name.trim()?it.name.trim():'Item sem nome',cents:c,k:k});
        });
        subtotal+=L;
        if(r>0)leftover=true;
      });
    }
  }
  const F=feeCents(subtotal,pct);
  let given=0;
  res.forEach(x=>{x.fee=subtotal>0?Math.floor(x.sub*F/subtotal):0;given+=x.fee;});
  const diff=F-given;
  if(diff>0&&n>0){
    const first=res.find(x=>x.sub>0)||res[0];
    first.fee+=diff;leftover=true;
  }
  let sum=0;
  res.forEach(x=>{x.total=x.sub+x.fee;sum+=x.total;});
  return {subtotal:subtotal,fee:F,total:subtotal+F,people:res,unassigned:unassigned,unassignedCents:unassignedCents,leftover:leftover,sum:sum};
}

/* ---- Pix (BR Code / EMV do Banco Central) ---- */
function crc16(str){
  let crc=0xFFFF;
  for(let i=0;i<str.length;i++){
    crc^=str.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){crc=(crc&0x8000)?(((crc<<1)^0x1021)&0xFFFF):((crc<<1)&0xFFFF);}
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
const tlv=(id,val)=>id+String(val.length).padStart(2,'0')+val;
function asciiClean(s,max,fallback){
  const t=String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().toUpperCase().slice(0,max).trim();
  return t||fallback;
}
function validCPF(d){
  if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  for(let t=9;t<11;t++){
    let s=0;
    for(let i=0;i<t;i++)s+=(+d[i])*(t+1-i);
    if(((s*10)%11)%10!==+d[t])return false;
  }
  return true;
}
function validCNPJ(d){
  if(d.length!==14||/^(\d)\1+$/.test(d))return false;
  const calc=len=>{
    let s=0,pos=len-7;
    for(let i=len;i>=1;i--){s+=(+d[len-i])*pos--;if(pos<2)pos=9;}
    const r=s%11;return r<2?0:11-r;
  };
  return calc(12)===+d[12]&&calc(13)===+d[13];
}
function normalizeKey(type,raw){
  const s=String(raw==null?'':raw).trim();
  if(type==='cpf')return onlyDigits(s);
  if(type==='phone'){
    let d=onlyDigits(s);
    if(d.indexOf('55')===0&&d.length>=12)d=d.slice(2);
    return d?'+55'+d:'';
  }
  return s.toLowerCase();
}
function keyError(type,key){
  if(!key)return 'Informe a chave Pix.';
  if(type==='cpf'){
    if(key.length===11)return validCPF(key)?'':'CPF inválido. Confira os números.';
    if(key.length===14)return validCNPJ(key)?'':'CNPJ inválido. Confira os números.';
    return 'CPF tem 11 números e CNPJ tem 14.';
  }
  if(type==='phone')return /^\+55\d{10,11}$/.test(key)?'':'Celular com DDD: 2 dígitos do DDD e 8 ou 9 do número.';
  if(type==='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(key)?'':'E-mail inválido.';
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(key)?'':'A chave aleatória tem o formato 8-4-4-4-12 (letras e números).';
}
function pixPayload(o){
  const gui=tlv('00','br.gov.bcb.pix')+tlv('01',o.key);
  let p=tlv('00','01')+tlv('01','11')+tlv('26',gui)+tlv('52','0000')+tlv('53','986');
  if(o.cents>0)p+=tlv('54',Math.floor(o.cents/100)+'.'+String(o.cents%100).padStart(2,'0'));
  p+=tlv('58','BR')+tlv('59',asciiClean(o.name,25,'RECEBEDOR'))+tlv('60',asciiClean(o.city,15,'BRASIL'))+tlv('62',tlv('05',o.txid||'***'));
  p+='6304';
  return p+crc16(p);
}

/* ---- WhatsApp ---- */
function waPhone(raw){
  let d=onlyDigits(raw);
  if(d.length===10||d.length===11)d='55'+d;
  return d.length>=12&&d.length<=13?d:'';
}
function waMessage(o){
  const L=[];
  L.push('Oi, '+o.name+'! 🍻 Sua parte da conta'+(o.place?' ('+o.place+')':'')+' ficou em *'+brl(o.total)+'*.');
  if(o.lines.length){
    L.push('','O que entrou:');
    o.lines.forEach(l=>L.push('• '+l.name+(l.k>1?' (÷'+l.k+')':'')+': '+brl(l.cents)));
    if(o.feeOn&&o.fee>0)L.push('• Serviço '+pctLabel(o.feePct)+'%: '+brl(o.fee));
  }
  if(o.code){
    L.push('','Pix copia e cola'+(o.payerName?' (para '+o.payerName+')':'')+':',o.code);
  }
  return L.join('\n');
}

function onField(t){
  const f=t.dataset.f;if(!f)return;
  const row=t.closest('[data-id]');
  const id=row?row.dataset.id:null;
  if(f==='place')S.place=t.value;
  else if(f==='pname'){const i=S.people.findIndex(p=>p.id===id);if(i>=0){S.people[i].name=t.value;const av=row.querySelector('.avatar');if(av)av.textContent=initial(S.people[i],i);}}
  else if(f==='pphone'){const p=byId(S.people,id);if(p)p.phone=t.value;}
  else if(f==='pct'){const v=parseFloat(String(t.value).replace(',','.'));S.fee.pct=isFinite(v)?Math.min(30,Math.max(0,v)):0;}
  else if(f==='iname'){const it=byId(S.items,id);if(it)it.name=t.value;}
  else if(f==='unit'){const it=byId(S.items,id);if(it)it.unit=maskInput(t);}
  else if(f==='total')S.total=maskInput(t);
  else if(f==='pixtype')S.pix.type=t.value;
  else if(f==='pixkey')S.pix.key=t.value;
  else if(f==='pixname')S.pix.name=t.value;
  else if(f==='pixcity')S.pix.city=t.value;
  else if(f==='pixrecv')S.pix.recv=t.value;
  save();refreshDerived();
}
view.addEventListener('input',e=>onField(e.target));
view.addEventListener('change',e=>{if(e.target.tagName==='SELECT')onField(e.target);});
view.addEventListener('toggle',e=>{
  const d=e.target;
  if(d&&d.matches&&d.matches('details[data-qr]')){if(d.open)openQR.add(d.dataset.qr);else openQR.delete(d.dataset.qr);}
},true);
view.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  const row=t.closest('[data-id]');
  const id=row?row.dataset.id:null;
  if(act==='add-person'){
    const p={id:uid('p'),name:'',phone:''};S.people.push(p);save();render();
    const inp=$('[data-id="'+p.id+'"] input');if(inp)inp.focus();
  }else if(act==='del-person'){
    if(S.people.length<2)return;
    S.people=S.people.filter(p=>p.id!==id);
    S.items.forEach(it=>{it.who=it.who.filter(w=>w!==id);});
    if(S.pix.recv===id)S.pix.recv='';
    save();render();
  }else if(act==='mode'){S.mode=t.dataset.mode;save();render();}
  else if(act==='fee-toggle'){S.fee.on=!S.fee.on;save();render();}
  else if(act==='clear'){S=blank();openQR.clear();save();render();}
  else if(act==='next'){go(t.dataset.to);}
  else if(act==='add-item'){
    const it={id:uid('i'),name:'',qty:1,unit:0,who:S.people.map(p=>p.id)};S.items.push(it);save();renderItems();
    const inp=$('[data-id="'+it.id+'"] input');if(inp)inp.focus();
  }else if(act==='del-item'){S.items=S.items.filter(x=>x.id!==id);save();renderItems();}
  else if(act==='qty-'||act==='qty+'){
    const it=byId(S.items,id);if(!it)return;
    it.qty=Math.min(99,Math.max(1,it.qty+(act==='qty+'?1:-1)));save();renderItems();
  }else if(act==='who'){
    const it=byId(S.items,id);if(!it)return;
    const k=it.who.indexOf(t.dataset.pid);
    if(k>=0)it.who.splice(k,1);else it.who.push(t.dataset.pid);
    save();renderItems();
  }else if(act==='all'){
    const it=byId(S.items,id);if(!it)return;
    const all=S.people.every(p=>it.who.indexOf(p.id)>=0);
    it.who=all?[]:S.people.map(p=>p.id);save();renderItems();
  }else if(act==='copy-pix'){
    const c=compute(S);const x=c.people.find(q=>q.id===t.dataset.pid);
    const code=x?pixFor(x):'';
    if(!code)return;
    const ok=await copyText(code);
    toast(ok?'Pix copia e cola copiado':'Não consegui copiar. Abra o QR Code e toque no código para copiar.');
  }else if(act==='open-pix'){
    const d=$('#pixd');if(d){d.open=true;d.scrollIntoView({block:'start'});const k=$('#pixkey');if(k)k.focus();}
  }
});
$$('.tabbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));

/* ================= Tema ================= */
try{const th=localStorage.getItem('racha-theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);}catch(e){}
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('racha-theme',next);}catch(e){}
});

/* ================= Início ================= */
render();
if(typeof qrcode!=='function'){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload=()=>{if(tab==='dividir')refreshDerived();};
  document.head.appendChild(s);
}
})();
